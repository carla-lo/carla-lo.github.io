<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carla</title>
  <meta name="description" content="Links to Carla's GitHub, Spotify and Strava">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f1115;
      color: #f2f2f2;
      padding: 24px;
    }
    .card { width: 100%; max-width: 420px; text-align: center; }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%;
      margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 700; letter-spacing: 1px;
      background: linear-gradient(135deg, #2b6cb0, #38a169);
    }
    h1 { font-size: 24px; margin-bottom: 6px; }
    .bio { color: #a0a4ab; font-size: 15px; margin-bottom: 28px; }
    .links { display: flex; flex-direction: column; gap: 14px; }
    .links a {
      display: block;
      padding: 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 17px;
      color: #fff;
      transition: transform .15s ease, opacity .15s ease;
    }
    .links a:hover { transform: translateY(-2px); opacity: .9; }
    .github  { background: #24292f; border: 1px solid #3d444d; }
    .spotify { background: #24292f; border: 1px solid #3d444d; }
    .strava  { background: #24292f; border: 1px solid #3d444d; }
    footer { margin-top: 32px; color: #5f646b; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar"></div>
    <h1>carla</h1>
    <p class="bio"></p>

    <nav class="links">
      <!-- Replace the three URLs below with your own -->
      <a class="github"  href="https://github.com/carI-Io" target="_blank" rel="noopener">GitHub</a>
      <a class="spotify" href="https://open.spotify.com/user/1196808453?si=cbefa6b4d0714a90" target="_blank" rel="noopener">Spotify</a>
      <a class="strava"  href="https://strava.app.link/FZtGXuOSd8b" target="_blank" rel="noopener">Strava</a>
    </nav>

    <footer></footer>
  </main>
</body>
</html>
